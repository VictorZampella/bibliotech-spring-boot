spring.profiles.active=${APP_PROFILE:dev}
spring.jpa.open-in-view=false
# Inicializa também a tabela de chaves idempotentes no PostgreSQL do Render.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

bibliotech.access.admin-user-ids=${BIBLIOTECH_ADMIN_USER_IDS:}
bibliotech.access.premium-user-ids=${BIBLIOTECH_PREMIUM_USER_IDS:}
bibliotech.rate-limit.ip-limit=${BIBLIOTECH_RATE_LIMIT_IP:120}
bibliotech.rate-limit.base-limit=${BIBLIOTECH_RATE_LIMIT_BASE:30}
bibliotech.rate-limit.premium-limit=${BIBLIOTECH_RATE_LIMIT_PREMIUM:100}
bibliotech.rate-limit.window=1m

